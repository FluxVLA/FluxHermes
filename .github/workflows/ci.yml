name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: |
          codespell
          flake8 fluxhermes test scripts test_integration test_gpu
          isort --check-only fluxhermes test scripts test_integration test_gpu
      - name: Test
        run: |
          pytest
          fluxhermes compile configs/pi05/pi05_aloha_fp16.py

  cpu-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verified CPU Torch and backend tests
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install '.[onnxruntime,dev]' onnx==1.18.0 onnxruntime==1.23.2
          python -m pip check
      - name: Test CPU contracts (not GPU execution)
        run: python -m unittest discover -s test_integration -v
