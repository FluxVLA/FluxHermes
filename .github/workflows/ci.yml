name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install 'torch==2.6.0' --index-url https://download.pytorch.org/whl/cpu
          # Pin the legacy exporter regression environment.
          python -m pip install 'onnx==1.17.0' 'onnxconverter-common>=1.14,<2' 'protobuf>=4.25.8,<6' 'ml-dtypes>=0.2,<1' 'onnxruntime>=1.19,<2' 'mmengine>=0.10,<1' 'safetensors>=0.4,<1'
      - name: Lint
        run: |
          codespell
          flake8 fluxhermes test scripts
          isort --check-only fluxhermes test scripts
      - name: Test
        run: |
          pytest
          fluxhermes-compile configs/pi05/pi05_aloha_fp16.py

  bundle-install:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
        dependencies: ['latest', 'legacy']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install base package without export or runtime extras
        run: python -m pip install .
      - name: Select legacy Protobuf descriptors
        if: matrix.dependencies == 'legacy'
        run: python -m pip install 'onnx==1.16.2' 'protobuf==3.20.3'
      - name: Check installed package outside source tree
        working-directory: ${{ runner.temp }}
        run: |
          python -m pip check
          python - <<'PY'
          import importlib.util
          import sys
          from pathlib import Path
          import fluxhermes
          import google.protobuf
          import onnx
          assert Path(fluxhermes.__file__).is_relative_to(Path(sys.prefix))
          assert importlib.util.find_spec('torch') is None
          print(fluxhermes.__file__, onnx.__version__, google.protobuf.__version__)
          PY
          python -m unittest discover -s "${{ github.workspace }}/test" -p test_dependencies.py
          python -m unittest discover -s "${{ github.workspace }}/test" -p test_onnx_tensor_walker.py
          python -m unittest discover -s "${{ github.workspace }}/test" -p test_bundle.py
