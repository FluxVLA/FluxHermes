[metadata]
name = fluxhermes
version = attr: fluxhermes.version.__version__
description = TensorRT export, acceleration, quantization, and robot runtime for FluxVLA
long_description = file: README.md
long_description_content_type = text/markdown
license = Apache-2.0
license_files = LICENSE
classifiers =
    Development Status :: 2 - Pre-Alpha
    Operating System :: POSIX :: Linux
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12

[options]
packages = find:
python_requires = >=3.10,<3.13
include_package_data = True
install_requires =
    numpy>=1.26,<3
    packaging>=23,<26

[options.extras_require]
export =
    torch>=2.4,<3
    onnx>=1.16,<2
    onnxconverter-common>=1.14,<2
    onnxsim>=0.4.36,<1
runtime =
    torch>=2.4,<3
quantization =
    onnxruntime-gpu>=1.19,<2
dev =
    codespell>=2.2,<3
    flake8>=7,<8
    isort>=5.11,<6
    pre-commit>=4,<5
    pytest>=7.4,<9
    yapf==0.43.0

[options.entry_points]
console_scripts =
    fluxhermes = fluxhermes.cli.main:main
    fluxhermes-compile = fluxhermes.cli.main:compile_main
    fluxhermes-inspect = fluxhermes.cli.main:inspect_main
    fluxhermes-run = fluxhermes.cli.main:run_main
    fluxdeploy = fluxhermes.cli.main:main

[options.packages.find]
exclude =
    test
    test.*

[aliases]
test = pytest

[tool:pytest]
testpaths = test
addopts = -ra

[flake8]
max-line-length = 88
extend-ignore = E203,W503

[yapf]
based_on_style = pep8
column_limit = 88
blank_line_before_nested_class_or_def = true
split_before_expression_after_opening_paren = true

[isort]
line_length = 88
multi_line_output = 0
known_first_party = fluxhermes
default_section = THIRDPARTY

[codespell]
quiet-level = 3
ignore-words-list = nd,ro,te,thirdparty
